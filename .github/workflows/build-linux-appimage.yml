name: Build Linux AppImage (self-hosted)

# Builds UNSIGNED BrowserOS Linux AppImages (x64 and/or arm64) on your own
# self-hosted runner(s) — no WarpBuild, no R2 secrets required. The agent
# server resources are built locally with Bun and staged into the browser, so
# the `download_resources` (R2) module is dropped from the build config.
#
# arm64 can be built two ways (input `arm64_mode`):
#   - cross  (default): cross-compiled on the x64 runner; `configure` installs
#             the arm64 sysroot and `install-build-deps.sh --arm` adds cross libs.
#   - native: built on an arm64 runner (labels from `arm64_runner_labels`).
#
# ── One-time runner setup ──────────────────────────────────────────────
#   Hardware (per runner): >=200 GB free disk, >=32 GB RAM, 16+ cores.
#   1. Repo → Settings → Actions → Runners → New self-hosted runner.
#      - x64 runner labels: self-hosted, Linux, X64   (x64 + arm64-cross)
#      - arm64 runner labels: self-hosted, Linux, ARM64  (only for arm64_mode=native)
#   2. Install on each runner: git, python3, curl, unzip, and Bun
#      (https://bun.sh). uv is auto-installed by astral-sh/setup-uv;
#      depot_tools is fetched by scripts/ci/setup_chromium.py; Chromium build
#      deps by the "Install Linux build deps" step (needs passwordless sudo).
#   3. Optional: repo variable BROWSEROS_CHROMIUM_SRC = persistent checkout path
#      so the ~100 GB Chromium tree is reused across runs.
#
# ── Run ────────────────────────────────────────────────────────────────
#   gh workflow run "Build Linux AppImage (self-hosted)" -f arch=both
#   # native arm64 (needs an arm64 runner):
#   gh workflow run "Build Linux AppImage (self-hosted)" -f arch=both -f arm64_mode=native
#   Artifacts (per arch): browseros-linux-<arch>  →  BrowserOS_v<ver>_<arch>.AppImage (+ .deb)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Architecture(s) to build
        type: choice
        default: both
        options:
          - both
          - x64
          - arm64
      arm64_mode:
        description: Build arm64 natively (on an arm64 runner) or cross-compiled (on the x64 runner)
        type: choice
        default: cross
        options:
          - cross
          - native
      x64_runner_labels:
        description: JSON array of labels for the x64 runner (used for x64, and for arm64 when arm64_mode=cross)
        type: string
        default: '["self-hosted","Linux","X64"]'
      arm64_runner_labels:
        description: JSON array of labels for the arm64 runner (used for arm64 when arm64_mode=native)
        type: string
        default: '["self-hosted","Linux","ARM64"]'

permissions:
  contents: read

concurrency:
  group: build-linux-appimage
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Resolve arch matrix
        id: plan
        env:
          ARCH: ${{ inputs.arch }}
          ARM64_MODE: ${{ inputs.arm64_mode }}
          X64_RUNNER: ${{ inputs.x64_runner_labels }}
          ARM64_RUNNER: ${{ inputs.arm64_runner_labels }}
        run: |
          set -euo pipefail
          # Each lane carries its own runner labels and install-build-deps flag:
          #   - x64: x64 runner, no cross flag.
          #   - arm64 cross: x64 runner + `--arm` (arm64 sysroot cross-compile).
          #   - arm64 native: arm64 runner, no cross flag.
          if [ "$ARM64_MODE" = "native" ]; then
            arm64_runner="$ARM64_RUNNER"
            arm64_deps_flag=""
          else
            arm64_runner="$X64_RUNNER"
            arm64_deps_flag="--arm"
          fi
          all="$(jq -c -n \
            --argjson x64r "$X64_RUNNER" \
            --argjson arm64r "$arm64_runner" \
            --arg armflag "$arm64_deps_flag" \
            '[
              {arch:"x64",   config:"release.linux.ci.yaml",       runner:$x64r,   deps_flag:""},
              {arch:"arm64", config:"release.linux.arm64.ci.yaml", runner:$arm64r, deps_flag:$armflag}
            ]')"
          if [ "$ARCH" != "both" ]; then
            matrix="$(jq -c --arg a "$ARCH" '[ .[] | select(.arch == $a) ]' <<<"$all")"
          else
            matrix="$(jq -c . <<<"$all")"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: build (linux-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 900
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.2.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Resolve chromium pin and paths
        id: pin
        run: |
          set -euo pipefail
          . packages/browseros/CHROMIUM_VERSION
          version="$MAJOR.$MINOR.$BUILD.$PATCH"

          # Persistent checkout dir (reused across runs). Prefer the repo var;
          # otherwise keep it next to the workspace, outside actions/checkout.
          root="${BROWSEROS_CHROMIUM_SRC_VAR:-}"
          if [ -n "$root" ]; then
            chromium_src="$root"
            chromium_root="$(dirname "$root")"
          else
            parent="$(cd "$GITHUB_WORKSPACE/.." && pwd)"
            chromium_root="$parent/browseros-chromium"
            chromium_src="$chromium_root/src"
          fi
          {
            echo "version=$version"
            echo "CHROMIUM_ROOT=$chromium_root"
            echo "CHROMIUM_SRC=$chromium_src"
          } >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          BROWSEROS_CHROMIUM_SRC_VAR: ${{ vars.BROWSEROS_CHROMIUM_SRC }}

      - name: Ensure chromium checkout at pinned tag
        run: |
          set -euo pipefail
          uv run --project packages/browseros python scripts/ci/setup_chromium.py \
            --chromium-root "$CHROMIUM_ROOT" --step checkout

      - name: Reset chromium tree (clean module)
        working-directory: packages/browseros
        run: |
          set -euo pipefail
          uv run browseros build --modules clean \
            --chromium-src "$CHROMIUM_SRC" \
            --build-type release \
            --arch "${{ matrix.arch }}"

      - name: Sync chromium dependencies (gclient)
        run: |
          set -euo pipefail
          uv run --project packages/browseros python scripts/ci/setup_chromium.py \
            --chromium-root "$CHROMIUM_ROOT" --step sync

      - name: Install Linux build deps
        run: |
          set -euo pipefail
          sudo apt-get update
          # libfuse2: appimagetool is itself an AppImage and needs FUSE
          sudo apt-get install -y libfuse2
          # deps_flag is "--arm" only for arm64 cross-compile on an x64 host;
          # empty for x64 and for native arm64 (host deps are already correct).
          "$CHROMIUM_SRC/build/install-build-deps.sh" --no-prompt ${{ matrix.deps_flag }}

      # Build the agent server locally and stage it into the browser tree so
      # download_resources (R2) is not needed. Includes local source changes.
      - name: Build & stage server resources (${{ matrix.arch }})
        run: |
          set -euo pipefail
          agent_root="$GITHUB_WORKSPACE/packages/browseros-agent"
          browseros_root="$GITHUB_WORKSPACE/packages/browseros"
          target="linux-${{ matrix.arch }}"

          cd "$agent_root"
          bun ci
          bun scripts/build/server.ts --target="$target" --ci

          AGENT_ROOT="$agent_root" BROWSEROS_ROOT="$browseros_root" TARGET="$target" \
          uv run --project "$browseros_root" python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          from build.modules.storage.download import extract_artifact_zip

          agent_root = Path(os.environ["AGENT_ROOT"])
          browseros_root = Path(os.environ["BROWSEROS_ROOT"])
          target = os.environ["TARGET"]
          archive = agent_root / f"dist/prod/server/browseros-server-resources-{target}.zip"
          destination = browseros_root / "resources/binaries/browseros_server" / target

          if not archive.is_file():
              raise SystemExit(f"Missing local server resource archive: {archive}")
          if destination.exists():
              shutil.rmtree(destination)
          extracted = extract_artifact_zip(archive, destination)
          print(f"Staged {len(extracted)} file(s) from {archive.name} -> {destination}")
          PY

      # Drop download_resources (R2) from the config — server is staged above.
      - name: Prepare build config (no R2 download_resources)
        id: cfg
        working-directory: packages/browseros
        env:
          BASE_CONFIG: build/config/${{ matrix.config }}
        run: |
          set -euo pipefail
          output_config="${RUNNER_TEMP:-/tmp}/browseros-linux-${{ matrix.arch }}-local.yaml"
          BASE_CONFIG="$BASE_CONFIG" OUTPUT_CONFIG="$output_config" uv run python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          base = Path(os.environ["BASE_CONFIG"])
          out = Path(os.environ["OUTPUT_CONFIG"])
          config = yaml.safe_load(base.read_text())
          config["modules"] = [m for m in config["modules"] if m != "download_resources"]
          out.write_text(yaml.safe_dump(config, sort_keys=False))
          print(out)
          PY
          echo "config=$output_config" >> "$GITHUB_OUTPUT"

      - name: Build BrowserOS AppImage (${{ matrix.arch }}, unsigned)
        working-directory: packages/browseros
        run: |
          set -euo pipefail
          uv run browseros build --config "${{ steps.cfg.outputs.config }}" \
            --chromium-src "$CHROMIUM_SRC"

      - name: Report disk usage
        if: always()
        run: df -h || true

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: browseros-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            packages/browseros/releases/*/*.AppImage
            packages/browseros/releases/*/*.deb
