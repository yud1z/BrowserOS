name: Build Linux AppImage (self-hosted)

# Builds UNSIGNED BrowserOS Linux AppImages (x64 and/or arm64) on your own
# self-hosted runner — no WarpBuild, no R2 secrets required. The agent server
# resources are built locally with Bun and staged into the browser, so the
# `download_resources` (R2) module is dropped from the build config. arm64 is
# cross-compiled from an x64 runner (configure installs the arm64 sysroot).
#
# ── One-time runner setup ──────────────────────────────────────────────
#   Hardware: >=200 GB free disk, >=32 GB RAM, 16+ cores recommended.
#   1. Repo → Settings → Actions → Runners → New self-hosted runner (Linux x64).
#      Give it labels: self-hosted, Linux, X64  (defaults below).
#   2. Install: git, python3, curl, unzip, and Bun (https://bun.sh).
#      uv is auto-installed by astral-sh/setup-uv. depot_tools is fetched by
#      scripts/ci/setup_chromium.py. Chromium build deps are installed by the
#      "Install Linux build deps" step (needs passwordless sudo for apt).
#   3. Optional: set repo variable BROWSEROS_CHROMIUM_SRC to a persistent path
#      (e.g. /home/runner/browseros-chromium/src) so the ~100 GB checkout is
#      reused across runs. Defaults to a path next to the workspace.
#
# ── Run ────────────────────────────────────────────────────────────────
#   gh workflow run "Build Linux AppImage (self-hosted)" -f arch=both
#   Artifacts (per arch): browseros-linux-<arch>  →  BrowserOS_v<ver>_<arch>.AppImage (+ .deb)

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Architecture(s) to build
        type: choice
        default: both
        options:
          - both
          - x64
          - arm64
      runner_labels:
        description: JSON array of runner labels to target
        type: string
        default: '["self-hosted","Linux","X64"]'

permissions:
  contents: read

concurrency:
  group: build-linux-appimage
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Resolve arch matrix
        id: plan
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail
          all='[
            {"arch":"x64","config":"release.linux.ci.yaml"},
            {"arch":"arm64","config":"release.linux.arm64.ci.yaml"}
          ]'
          if [ "$ARCH" != "both" ]; then
            matrix="$(jq -c --arg a "$ARCH" '[ .[] | select(.arch == $a) ]' <<<"$all")"
          else
            matrix="$(jq -c . <<<"$all")"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: build (linux-${{ matrix.arch }})
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    timeout-minutes: 900
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.2.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Resolve chromium pin and paths
        id: pin
        run: |
          set -euo pipefail
          . packages/browseros/CHROMIUM_VERSION
          version="$MAJOR.$MINOR.$BUILD.$PATCH"

          # Persistent checkout dir (reused across runs). Prefer the repo var;
          # otherwise keep it next to the workspace, outside actions/checkout.
          root="${BROWSEROS_CHROMIUM_SRC_VAR:-}"
          if [ -n "$root" ]; then
            chromium_src="$root"
            chromium_root="$(dirname "$root")"
          else
            parent="$(cd "$GITHUB_WORKSPACE/.." && pwd)"
            chromium_root="$parent/browseros-chromium"
            chromium_src="$chromium_root/src"
          fi
          {
            echo "version=$version"
            echo "CHROMIUM_ROOT=$chromium_root"
            echo "CHROMIUM_SRC=$chromium_src"
          } >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          BROWSEROS_CHROMIUM_SRC_VAR: ${{ vars.BROWSEROS_CHROMIUM_SRC }}

      - name: Ensure chromium checkout at pinned tag
        run: |
          set -euo pipefail
          uv run --project packages/browseros python scripts/ci/setup_chromium.py \
            --chromium-root "$CHROMIUM_ROOT" --step checkout

      - name: Reset chromium tree (clean module)
        working-directory: packages/browseros
        run: |
          set -euo pipefail
          uv run browseros build --modules clean \
            --chromium-src "$CHROMIUM_SRC" \
            --build-type release \
            --arch "${{ matrix.arch }}"

      - name: Sync chromium dependencies (gclient)
        run: |
          set -euo pipefail
          uv run --project packages/browseros python scripts/ci/setup_chromium.py \
            --chromium-root "$CHROMIUM_ROOT" --step sync

      - name: Install Linux build deps
        run: |
          set -euo pipefail
          sudo apt-get update
          # libfuse2: appimagetool is itself an AppImage and needs FUSE
          sudo apt-get install -y libfuse2
          extra=""
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            extra="--arm"
          fi
          "$CHROMIUM_SRC/build/install-build-deps.sh" --no-prompt $extra

      # Build the agent server locally and stage it into the browser tree so
      # download_resources (R2) is not needed. Includes local source changes.
      - name: Build & stage server resources (${{ matrix.arch }})
        run: |
          set -euo pipefail
          agent_root="$GITHUB_WORKSPACE/packages/browseros-agent"
          browseros_root="$GITHUB_WORKSPACE/packages/browseros"
          target="linux-${{ matrix.arch }}"

          cd "$agent_root"
          bun ci
          bun scripts/build/server.ts --target="$target" --ci

          AGENT_ROOT="$agent_root" BROWSEROS_ROOT="$browseros_root" TARGET="$target" \
          uv run --project "$browseros_root" python - <<'PY'
          import os
          import shutil
          from pathlib import Path

          from build.modules.storage.download import extract_artifact_zip

          agent_root = Path(os.environ["AGENT_ROOT"])
          browseros_root = Path(os.environ["BROWSEROS_ROOT"])
          target = os.environ["TARGET"]
          archive = agent_root / f"dist/prod/server/browseros-server-resources-{target}.zip"
          destination = browseros_root / "resources/binaries/browseros_server" / target

          if not archive.is_file():
              raise SystemExit(f"Missing local server resource archive: {archive}")
          if destination.exists():
              shutil.rmtree(destination)
          extracted = extract_artifact_zip(archive, destination)
          print(f"Staged {len(extracted)} file(s) from {archive.name} -> {destination}")
          PY

      # Drop download_resources (R2) from the config — server is staged above.
      - name: Prepare build config (no R2 download_resources)
        id: cfg
        working-directory: packages/browseros
        env:
          BASE_CONFIG: build/config/${{ matrix.config }}
        run: |
          set -euo pipefail
          output_config="${RUNNER_TEMP:-/tmp}/browseros-linux-${{ matrix.arch }}-local.yaml"
          BASE_CONFIG="$BASE_CONFIG" OUTPUT_CONFIG="$output_config" uv run python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          base = Path(os.environ["BASE_CONFIG"])
          out = Path(os.environ["OUTPUT_CONFIG"])
          config = yaml.safe_load(base.read_text())
          config["modules"] = [m for m in config["modules"] if m != "download_resources"]
          out.write_text(yaml.safe_dump(config, sort_keys=False))
          print(out)
          PY
          echo "config=$output_config" >> "$GITHUB_OUTPUT"

      - name: Build BrowserOS AppImage (${{ matrix.arch }}, unsigned)
        working-directory: packages/browseros
        run: |
          set -euo pipefail
          uv run browseros build --config "${{ steps.cfg.outputs.config }}" \
            --chromium-src "$CHROMIUM_SRC"

      - name: Report disk usage
        if: always()
        run: df -h || true

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: browseros-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            packages/browseros/releases/*/*.AppImage
            packages/browseros/releases/*/*.deb
